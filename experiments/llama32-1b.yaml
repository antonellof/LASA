# Llama 3.2 1B family experiment config (M4 second family, local execution).
run_id: llama32-1b
seed: 0

authorization: configs/authorization.poc.json

base:
  model_id: unsloth/Llama-3.2-1B-Instruct

variants:
  - model_id: cognitivecomputations/Dolphin3.0-Llama3.2-1B
  - model_id: unsloth/Llama-3.2-1B
  - model_id: open-unlearning/tofu_Llama-3.2-1B-Instruct_full

benchmark:
  name: jailbreakbench
  subset: standard
  limit: 12

similarity:
  metrics: [cka, cosine_meanpool]
  probe_set: configs/neutral_probes.txt

attacks:
  primitives: [refusal_direction, gcg]
  contrast_pairs: 64
  max_new_tokens: 48
  gcg:
    num_steps: 5
    search_width: 16
    topk: 16

predict:
  scoring: strength_times_similarity
  # The committed results were produced with refcos_times_cka (ADR-0009).
  similarity_metric: refcos_times_cka

verify:
  top_k: 24
  generations_per_attack: 5
  judge: local
  max_new_tokens: 48
  human_spotcheck_fraction: 0.25

report:
  out_dir: reports/llama32-1b
