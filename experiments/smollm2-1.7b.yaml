# SmolLM2 1.7B family experiment config (HuggingFaceTB SmolLM2 lineage).
run_id: smollm2-1.7b
seed: 0

authorization: configs/authorization.poc.json

base:
  model_id: HuggingFaceTB/SmolLM2-1.7B-Instruct

variants:
  - model_id: saidutta69/SmolLM2-1.7B-Instruct-heretic
  - model_id: HuggingFaceTB/SmolLM2-1.7B
  - model_id: yoshitomo-matsubara/smollm2_1_7b-alpaca-it

benchmark:
  name: jailbreakbench
  subset: standard
  limit: 12

similarity:
  metrics: [cka, cosine_meanpool]
  probe_set: configs/neutral_probes.txt

attacks:
  primitives: [refusal_direction, gcg]
  contrast_pairs: 64
  max_new_tokens: 48
  gcg:
    num_steps: 5
    search_width: 16
    topk: 16

predict:
  scoring: strength_times_similarity
  # The committed results were produced with refcos_times_cka (ADR-0009).
  similarity_metric: refcos_times_cka

verify:
  top_k: 24
  generations_per_attack: 5
  judge: local
  max_new_tokens: 48
  human_spotcheck_fraction: 0.25

report:
  out_dir: reports/smollm2-1.7b
