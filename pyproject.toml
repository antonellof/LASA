[project]
name = "lasa"
version = "0.0.1"
description = "Lineage Attack Surface Analyzer: measure and predict inherited jailbreak vulnerability in fine-tuned LLMs (defensive research)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy==1.26.4",
    "pyyaml==6.0.2",
    "jsonschema==4.23.0",
    "scipy==1.13.1",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]
models = [
    "torch==2.5.1",
    "transformers==4.46.3",
    "accelerate==1.1.1",
    "safetensors==0.4.5",
    "sentencepiece==0.2.0",
    "protobuf==5.28.3",
    "nanogcg==0.3.0",
]

[project.scripts]
lasa = "lasa.cli:main"

[tool.setuptools.package-data]
"lasa.schemas" = ["*.json"]

[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"
